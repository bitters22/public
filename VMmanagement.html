: #64748b;\n      font-size: 11px;\n      font-weight: 700;\n    }\n\n    .footer-left { left: 32px; }\n    .footer-right { right: 24px; }\n  </style>\n</head>\n<body>\n  <main class=\"slide\">\n    <div class=\"pagehead\">04 / ① AI基盤構築の売上化</div>\n    <h1>全社展開時の提案余地</h1>\n    <div class=\"subtitle\">保守費削減効果をAI基盤構築の価値として見ると、約50億円の提案余地がある</div>\n\n    <section class=\"content\">\n      <div class=\"row\">\n        <div class=\"card gray\">\n          <div class=\"card-title\">① 削減対象</div>\n          <div class=\"text\">\n            AI基盤を構築した前提で試算した結果、<br>\n            保守工数の <strong>1/3程度は削減対象にできる</strong> と判断した。\n          </div>\n          <div class=\"note\">※次ページで、3名保守プロジェクトをモデルケースとした試算内容を説明</div>\n        </div>\n\n        <div class=\"card teal\">\n          <div class=\"card-title\">② AI基盤構築の価値（売上換算）</div>\n          <div class=\"text\">\n            AI基盤構築の価値は、削減できる年間保守費の<br>\n            <strong>2年分</strong> を目安として試算する。\n          </div>\n          <div class=\"value-formula\">年間保守費削減額 × 2年</div>\n          <div class=\"note\">2年で投資回収できる水準であれば、顧客の投資判断・社内稟議にも通しやすい。</div>\n        </div>\n      </div>\n\n      <div class=\"calc\">\n        <div class=\"calc-head\">\n          <div class=\"calc-title\">③ 全社展開時の提案余地</div>\n          <div class=\"formula\">計算補足：76億円 × 1/3 × 2年 ＝ 約50.7億円</div>\n        </div>\n\n        <div class=\"metrics\">\n          <div class=\"metric\">\n            <div class=\"k\">全社売上</div>\n            <div class=\"v\">152億円</div>\n          </div>\n          <div class=\"metric\">\n            <div class=\"k\">保守売上</div>\n            <div class=\"v\">約76億円</div>\n            <div class=\"s\">全社売上の50％と仮定</div>\n          </div>\n          <div class=\"metric\">\n            <div class=\"k\">保守費1/3削減</div>\n            <div class=\"v\">約25億円</div>\n            <div class=\"s\">年間削減効果</div>\n          </div>\n          <div class=\"metric\">\n            <div class=\"k\">価値の目安</div>\n            <div class=\"v\">× 2年</div>\n            <div class=\"s\">投資回収の目安</div>\n          </div>\n          <div class=\"metric highlight\">\n            <div class=\"k\">提案余地</div>\n            <div class=\"v\">約50億円</div>\n            <div class=\"s\">売上換算価値</div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"message\">\n        約50億円の提案余地は、売上15％向上に必要な約23億円を大きく上回る。<br>\n        <span class=\"message-sub\">一人保守などの制約により全ての保守PJで提案できるわけではないが、15％達成は大いに望める。</span>\n      </div>\n    </section>\n\n        <div class=\"footer-right\">04</div>\n  </main>\n</body>\n</html>","script":"では、売上15％向上に必要な約23億円が、実際に狙える規模なのか、全社展開した場合の提案余地を試算します。\n\n考え方は大きく2つです。\n\n1つ目は、AI基盤を構築した前提で、保守工数の3分の1程度を削減対象にできるという考え方です。この根拠は、次のモデルケースで説明します。\n\n2つ目は、AI基盤構築の価値を、削減できる年間保守費の2年分と見ることです。2年で投資回収できる水準であれば、顧客も投資判断しやすいと考えました。\n\nこの考え方を全社に当てはめ、提案余地の規模感を試算すると、次のようになります。\n\n全社売上を152億円、そのうち保守売上を約半分の76億円と仮定します。その3分の1を削減対象にすると年間約25億円、2年分では約50億円の提案余地になります。\n\nかなり粗い前提を置いた試算ではありますが、全社に展開した場合に、どの程度の提案余地があるのか、その規模感は伝えられると思います。\n\n一人保守のように削減余地が限られるプロジェクトもあるため、すべての保守プロジェクトで同じように提案できるわけではありません。\n\nそれでも、売上15％向上に必要な約23億円は、十分に狙える規模だと考えています。","point":"約50億円は提案余地。23億円は十分狙える。","speechText":"では、売上15％向上に必要な約23億円が、実際に狙える規模なのか、全社展開した場合の提案余地を試算します。\n\n考え方は大きく2つです。\n\n1つ目は、AI基盤を構築した前提で、保守工数の3分の1程度を削減対象にできるという考え方です。この根拠は、次のモデルケースで説明します。\n\n2つ目は、AI基盤構築の価値を、削減できる年間保守費の2年分と見ることです。2年で投資回収できる水準であれば、顧客も投資判断しやすいと考えました。\n\nこの考え方を全社に当てはめ、提案余地の規模感を試算すると、次のようになります。\n\n全社売上を152億円、そのうち保守売上を約半分の76億円と仮定します。その3分の1を削減対象にすると年間約25億円、2年分では約50億円の提案余地になります。\n\nかなり粗い前提を置いた試算ではありますが、全社に展開した場合に、どの程度の提案余地があるのか、その規模感は伝えられると思います。\n\n一人保守のように削減余地が限られるプロジェクトもあるため、すべての保守プロジェクトで同じように提案できるわけではありません。\n\nそれでも、売上15％向上に必要な約23億円は、十分に狙える規模だと考えています。"},{"title":"3名保守プロジェクトのモデルケース","srcdoc":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>3名保守プロジェクトのモデルケース</title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --ink: #0f172a;\n      --muted: #475569;\n      --blue: #2563eb;\n      --blue-dark: #1d4ed8;\n      --blue-soft: #eaf2ff;\n      --teal-soft: #d9eeee;\n      --navy: #0f3153;\n      --line: #d7e0ea;\n      --highlight: #fff7db;\n    }\n\n    * { box-sizing: border-box; }\n\n    body {\n      margin: 0;\n      background: #e6edf5;\n      font-family: \"Yu Gothic\", \"Hiragino Kaku Gothic ProN\", Meiryo, sans-serif;\n      color: var(--ink);\n    }\n\n    .slide {\n      width: 1280px;\n      height: 720px;\n      margin: 0 auto;\n      background: var(--bg);\n      padding: 18px 32px 20px;\n      position: relative;\n      overflow: hidden;\n    }\n\n    .pagehead {\n      font-size: 12px;\n      font-weight: 800;\n      color: var(--blue);\n      margin-bottom: 4px;\n      letter-spacing: .02em;\n    }\n\n    h1 {\n      margin: 0;\n      font-size: 30px;\n      line-height: 1.14;\n      letter-spacing: -.02em;\n      color: var(--ink);\n    }\n\n    .subtitle {\n      margin-top: 6px;\n      color: var(--blue);\n      font-size: 19px;\n      font-weight: 850;\n      line-height: 1.2;\n    }\n\n    .content {\n      width: 94%;\n      margin: 8px auto 0;\n      display: flex;\n      flex-direction: column;\n      gap: 6px;\n    }\n\n    .case-row {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 10px;\n    }\n\n    .case-card {\n      background: #fff;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 5px 12px;\n      box-shadow: 0 2px 8px rgba(15, 23, 42, .04);\n      text-align: center;\n    }\n\n    .case-k {\n      font-size: 13px;\n      font-weight: 850;\n      color: #475569;\n      margin-bottom: 4px;\n    }\n\n    .case-v {\n      font-size: 20px;\n      line-height: 1.2;\n      font-weight: 950;\n      color: var(--blue-dark);\n    }\n\n    .case-v small {\n      font-size: 14px;\n      color: #64748b;\n      font-weight: 800;\n    }\n\n    .table-wrap {\n      background: #fff;\n      border: 1px solid var(--line);\n      border-radius: 16px;\n      padding: 6px 8px 6px;\n      box-shadow: 0 2px 8px rgba(15, 23, 42, .04);\n    }\n\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      table-layout: fixed;\n      font-size: 12.1px;\n      line-height: 1.22;\n    }\n\n    th {\n      background: #eaf2ff;\n      color: #0f172a;\n      font-size: 11.8px;\n      font-weight: 900;\n      padding: 5px 6px;\n      border: 1px solid #cbd8eb;\n      text-align: left;\n    }\n\n    td {\n      border: 1px solid #d9e2ef;\n      padding: 4px 6px;\n      vertical-align: top;\n      font-weight: 650;\n      color: #1e293b;\n    }\n\n    th:nth-child(1), td:nth-child(1) { width: 17%; }\n    th:nth-child(2), td:nth-child(2) { width: 9%; text-align: right; white-space: nowrap; }\n    th:nth-child(3), td:nth-child(3) { width: 49%; }\n    th:nth-child(4), td:nth-child(4) { width: 25%; }\n\n    .target-row td {\n      background: var(--highlight);\n      font-weight: 850;\n    }\n\n    .total-row td {\n      background: #f8fafc;\n      font-weight: 900;\n    }\n\n    .hours {\n      color: var(--blue-dark);\n      font-weight: 950;\n    }\n\n    .thinking {\n      background: #eef5ff;\n      border: 1px solid #c7d8f7;\n      border-radius: 14px;\n      padding: 7px 14px;\n      font-size: 15px;\n      line-height: 1.45;\n      font-weight: 780;\n      color: #1e293b;\n      box-shadow: 0 2px 8px rgba(15, 23, 42, .04);\n      text-align: center;\n    }\n\n    .thinking strong {\n      color: var(--blue-dark);\n      font-weight: 950;\n    }\n\n    .message {\n      background: var(--navy);\n      color: #fff;\n      border-radius: 14px;\n      padding: 9px 20px;\n      text-align: center;\n      font-size: 20px;\n      line-height: 1.3;\n      font-weight: 950;\n      box-shadow: 0 6px 18px rgba(15, 49, 83, .14);\n    }\n\n    .footer-left, .footer-right {\n      position: absolute;\n      bottom: 6px;\n      color: #64748b;\n      font-size: 11px;\n      font-weight: 700;\n    }\n\n    .footer-left { left: 32px; }\n    .footer-right { right: 24px; }\n  </style>\n</head>\n<body>\n  <main class=\"slide\">\n    <div class=\"pagehead\">05 / ① AI基盤構築の売上化</div>\n    <h1>3名保守プロジェクトのモデルケース</h1>\n    <div class=\"subtitle\">保守業務を分解し、AI基盤化の初期対象200hを抽出する</div>\n\n    <section class=\"content\">\n      <div class=\"case-row\">\n        <div class=\"case-card\">\n          <div class=\"case-k\">ケース</div>\n          <div class=\"case-v\">3名保守プロジェクト</div>\n        </div>\n        <div class=\"case-card\">\n          <div class=\"case-k\">月間工数</div>\n          <div class=\"case-v\">450h/月<br><small>150h × 3名</small></div>\n        </div>\n        <div class=\"case-card\">\n          <div class=\"case-k\">削減目標</div>\n          <div class=\"case-v\">1名分 150h/月</div>\n        </div>\n      </div>\n\n      <div class=\"table-wrap\">\n        <table>\n          <thead>\n            <tr>\n              <th>現在の保守業務</th>\n              <th>現在の月間工数</th>\n              <th>AI基盤化で行うこと</th>\n              <th>AI基盤化の仕組み<br>（仕組み・ツール・処理）</th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr class=\"target-row\">\n              <td>問い合わせ対応</td>\n              <td><span class=\"hours\">120h</span></td>\n              <td>問い合わせ内容を受け取り、過去QA・仕様書・障害履歴・対応履歴を横断検索。回答案、根拠資料、追加確認事項、類似チケットを提示する</td>\n              <td>Copilot Studio／RAG／ナレッジ検索／Redmine連携</td>\n            </tr>\n            <tr class=\"target-row\">\n              <td>影響調査・仕様調査</td>\n              <td><span class=\"hours\">80h</span></td>\n              <td>対象モジュール・画面・テーブル・バッチ・連携システムを、設計書・連携システム一覧・変更履歴から抽出。影響候補、確認順序、テスト観点を提示する</td>\n              <td>RAG／文書インデックス／全文検索／設計書検索</td>\n            </tr>\n            <tr>\n              <td>障害対応・原因調査</td>\n              <td>30h</td>\n              <td>エラー文言、ログ、発生日、対象ジョブをもとに、類似障害、過去原因、暫定対応、確認ログを提示する</td>\n              <td>RAG／Redmine連携／ログ検索／ジョブ履歴検索</td>\n            </tr>\n            <tr>\n              <td>定型確認・日次/月次作業</td>\n              <td>30h</td>\n              <td>確認結果を取り込み、正常・異常 n: column;\n      gap: 10px;\n    }\n\n    .lead {\n      background: #ffffff;\n      border-left: 7px solid var(--blue);\n      border-top: 1px solid var(--line);\n      border-right: 1px solid var(--line);\n      border-bottom: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 13px 18px;\n      font-size: 17px;\n      line-height: 1.5;\n      font-weight: 780;\n      color: #1e293b;\n      box-shadow: 0 2px 8px rgba(15, 23, 42, .04);\n    }\n\n    .lead strong {\n      color: var(--blue-dark);\n      font-weight: 950;\n    }\n\n    .role-table {\n      background: #fff;\n      border: 1px solid var(--line);\n      border-radius: 16px;\n      padding: 10px 10px 9px;\n      box-shadow: 0 2px 8px rgba(15, 23, 42, .04);\n    }\n\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      table-layout: fixed;\n      font-size: 16px;\n      line-height: 1.35;\n    }\n\n    th {\n      padding: 10px 12px;\n      border: 1px solid #cbd8eb;\n      font-size: 16px;\n      font-weight: 900;\n      text-align: left;\n    }\n\n    th.current {\n      background: #f3f4f6;\n      color: #334155;\n      width: 40%;\n    }\n\n    th.next {\n      background: #eaf2ff;\n      color: var(--blue-dark);\n      width: 55%;\n    }\n\n    th.arrow-head {\n      width: 5%;\n      background: #f8fafc;\n      color: #64748b;\n      text-align: center;\n    }\n\n    td {\n      border: 1px solid #d9e2ef;\n      padding: 8px 10px;\n      vertical-align: middle;\n      font-weight: 720;\n      color: #1e293b;\n      background: #ffffff;\n    }\n\n    td.current-cell {\n      background: #ffffff;\n    }\n\n    td.arrow-cell {\n      text-align: center;\n      color: #94a3b8;\n      font-size: 22px;\n      font-weight: 950;\n      background: #f8fafc;\n    }\n\n    td.next-cell {\n      background: #f8fbff;\n      font-weight: 820;\n    }\n\n    td.next-cell strong {\n      color: var(--blue-dark);\n      font-weight: 950;\n    }\n\n    .effect {\n      background: var(--green-soft);\n      border: 1px solid #bdded6;\n      border-radius: 14px;\n      padding: 10px 18px;\n      font-size: 15px;\n      line-height: 1.45;\n      font-weight: 800;\n      color: #134e4a;\n      box-shadow: 0 2px 8px rgba(15, 23, 42, .04);\n      text-align: center;\n    }\n\n    .effect-label {\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      padding: 4px 13px;\n      border-radius: 999px;\n      font-size: 13px;\n      font-weight: 850;\n      color: var(--green);\n      background: #ffffff;\n      margin-right: 10px;\n    }\n\n    .message {\n      background: var(--navy);\n      color: #fff;\n      border-radius: 14px;\n      padding: 12px 20px;\n      text-align: center;\n      font-size: 22px;\n      line-height: 1.3;\n      font-weight: 950;\n      box-shadow: 0 6px 18px rgba(15, 49, 83, .14);\n    }\n\n    .footer-left, .footer-right {\n      position: absolute;\n      bottom: 8px;\n      color: #64748b;\n      font-size: 11px;\n      font-weight: 700;\n    }\n\n    .footer-left { left: 32px; }\n    .footer-right { right: 24px; }\n  </style>\n</head>\n<body>\n  <main class=\"slide\">\n    <div class=\"pagehead\">07 / ③ 保守メンバーの役割の高次元化</div>\n    <h1>保守メンバーの役割の高次元化</h1>\n    <div class=\"subtitle\">AI基盤構築を通じて、作業担当から改善提案を担う人材へ変える</div>\n\n    <section class=\"content\">\n      <div class=\"lead\">\n        <strong>AI基盤構築には、現行保守メンバーの協力が必要不可欠である。</strong><br>\n        AIに任せる範囲、人が判断する範囲、ナレッジの使い方を整理することで、保守メンバーの役割を高次元化する機会になる。\n      </div>\n\n      <div class=\"role-table\">\n        <table>\n          <thead>\n            <tr>\n              <th class=\"current\">現在の役割</th>\n              <th class=\"arrow-head\"></th>\n              <th class=\"next\">今後の役割</th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr>\n              <td class=\"current-cell\">問い合わせに回答する</td>\n              <td class=\"arrow-cell\">→</td>\n              <td class=\"next-cell\">問い合わせ内容を整理し、<strong>AI回答・ナレッジ化</strong>につなげる</td>\n            </tr>\n            <tr>\n              <td class=\"current-cell\">障害対応を行う</td>\n              <td class=\"arrow-cell\">→</td>\n              <td class=\"next-cell\">障害履歴を整理し、<strong>再発防止や改善提案</strong>につなげる</td>\n            </tr>\n            <tr>\n              <td class=\"current-cell\">影響調査を行う</td>\n              <td class=\"arrow-cell\">→</td>\n              <td class=\"next-cell\">調査観点を整理し、<strong>AI基盤に組み込む</strong></td>\n            </tr>\n            <tr>\n              <td class=\"current-cell\">定型作業を実施する</td>\n              <td class=\"arrow-cell\">→</td>\n              <td class=\"next-cell\">定型作業を<strong>AI・自動化の対象</strong>として整理する</td>\n            </tr>\n          </tbody>\n        </table>\n      </div>\n\n      <div class=\"message\">\n        保守メンバーを、作業担当から改善提案を担う人材へ高次元化する。\n      </div>\n\n      <div class=\"effect\">\n        <span class=\"effect-label\">副次効果</span>\n        保守メンバーの役割を高次元化することで、成長実感とモチベーションを高め、離職リスクの低減にもつなげる。\n      </div>\n    </section>\n\n        <div class=\"footer-right\">07</div>\n  </main>\n</body>\n</html>","script":"次に、3つ目の軸である、保守メンバーの役割の高次元化です。\n\nAI基盤構築による保守費削減を、単なる要員削減で終わらせず、現行保守メンバーの成長にもつなげます。\n\nAIに任せる範囲、ひとが判断する範囲、どのナレッジを使うかは、保守現場を理解している人でなければ整理できません。\n\nそのため、AI基盤構築には現行保守メンバーの協力が必要です。\n\nこれまでの問い合わせ対応や障害対応といった作業中心の役割から、ナレッジ化、再発防止、調査観点の整理、自動化対象の選定を担う役割へ変えていきます。\n\nつまり、保守メンバーを、作業担当から改善提案を担う人材へ高次元化します。\n\nこれは成長実感やモチベーション向上につながり、離職リスクの低減も期待できます。","point":"提言の軸の3つ目に移ったことを先に伝える。","speechText":"次に、3つ目の軸である、保守メンバーの役割の高次元化です。\n\nAI基盤構築による保守費削減を、単なる要員削減で終わらせず、現行保守メンバーの成長にもつなげます。\n\nAIに任せる範囲、ひとが判断する範囲、どのナレッジを使うかは、保守現場を理解している人でなければ整理できません。\n\nそのため、AI基盤構築には現行保守メンバーの協力が必要です。\n\nこれまでの問い合わせ対応や障害対応といった作業中心の役割から、ナレッジ化、再発防止、調査観点の整理、自動化対象の選定を担う役割へ変えていきます。\n\nつまり、保守メンバーを、作業担当から改善提案を担う人材へ高次元化します。\n\nこれは成長実感やモチベーション向上につながり、離職リスクの低減も期待できます。"},{"title":"まとめ","srcdoc":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>まとめ</title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --ink: #0f172a;\n      --muted: #475569;\n      --blue: #2563eb;\n      --blue-dark: #1d4ed8;\n      --blue-soft: #eaf2ff;\n      --blue-mid: #c7d8ff;\n      --navy: #0f3153;\n      --line: #d7e0ea;\n      --gray: #f8fafc;\n    }\n\n    * { box-sizing: border-box; }\n\n    body {\n      margin: 0;\n      background: #e6edf5;\n      font-family: \"Yu Gothic\", \"Hiragino Kaku Gothic ProN\", Meiryo, sans-serif;\n      color: var(--ink);\n    }\n\n    .slide {\n      width: 1280px;\n      height: 720px;\n      margin: 0 auto;\n      background: var(--bg);\n      padding: 22px 32px 24px;\n      position: relative;\n      overflow: hidden;\n    }\n\n    .pagehead {\n      font-size: 14px;\n      font-weight: 800;\n      color: var(--blue);\n      margin-bottom: 6px;\n      letter-spacing: .02em;\n    }\n\n    h1 {\n      margin: 0;\n      font-size: 34px;\n      line-height: 1.14;\n      letter-spacing: -.02em;\n      color: var(--ink);\n    }\n\n    .subtitle {\n      margin-top: 8px;\n      color: var(--blue);\n      font-size: 22px;\n      font-weight: 850;\n      line-height: 1.25;\n    }\n\n    .content {\n      width: 88%;\n      margin: 22px auto 0;\n      display: flex;\n      flex-direction: column;\n      gap: 12px;\n    }\n\n    .axis-wrap {\n      background: #fff;\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 12px 14px;\n      box-shadow: 0 2px 8px rgba(15, 23, 42, .04);\n    }\n\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      table-layout: fixed;\n      font-size: 17px;\n      line-height: 1.45;\n    }\n\n    th {\n      background: #eaf2ff;\n      color: var(--blue-dark);\n      padding: 10px 14px;\n      border: 1px solid #cbd8eb;\n      font-weight: 900;\n      text-align: left;\n    }\n\n    th:first-child {\n      width: 32%;\n    }\n\n    td {\n      border: 1px solid #d9e2ef;\n      padding: 12px 14px;\n      vertical-align: middle;\n      font-weight: 730;\n      color: #1e293b;\n      background: #ffffff;\n    }\n\n    .axis {\n      color: var(--blue-dark);\n      font-weight: 950;\n    }\n\n    .tag-row {\n      text-align: left;\n      margin-bottom: -9px;\n    }\n\n    .message-tag {\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      width: fit-content;\n      padding: 5px 14px;\n      border-radius: 999px;\n      font-size: 13px;\n      line-height: 1;\n      font-weight: 900;\n      margin: 0;\n      letter-spacing: .01em;\n    }\n\n    .tag-blue {\n      background: #dbeafe;\n      color: #1d4ed8;\n      border: 1px solid #bfdbfe;\n    }\n\n    .tag-white {\n      background: rgba(255,255,255,.12);\n      color: #dbeafe;\n      border: 1px solid rgba(219,234,254,.28);\n    }\n\n    .bridge {\n      background: linear-gradient(180deg, #eef5ff 0%, #e4efff 100%);\n      border: 1px solid #c7d8f7;\n      border-radius: 18px;\n      padding: 18px 24px;\n      text-align: center;\n      font-size: 22px;\n      line-height: 1.45;\n      font-weight: 900;\n      color: #0f172a;\n      box-shadow: 0 2px 8px rgba(15, 23, 42, .04);\n    }\n\n    .bridge strong {\n      font-weight: 950;\n    }\n\n    .bridge .threat-word {\n      color: #D64545;\n    }\n\n    .bridge .opportunity-word {\n      color: var(--blue-dark);\n    }\n\n    .final {\n      background: var(--navy);\n      color: #fff;\n      border-radius: 20px;\n      padding: 20px 28px;\n      text-align: center;\n      box-shadow: 0 7px 20px rgba(15, 49, 83, .16);\n    }\n\n    .final-main {\n      font-size: 30px;\n      line-height: 1.22;\n      font-weight: 950;\n      margin-bottom: 10px;\n      letter-spacing: .02em;\n    }\n\n    .final-sub {\n      font-size: 23px;\n      line-height: 1.45;\n      font-weight: 850;\n      color: #dbeafe;\n    }\n\n    .footer-left, .footer-right {\n      position: absolute;\n      bottom: 8px;\n      color: #64748b;\n      font-size: 11px;\n      font-weight: 700;\n    }\n\n    .footer-left { left: 32px; }\n    .footer-right { right: 24px; }\n  </style>\n</head>\n<body>\n  <main class=\"slide\">\n    <div class=\"pagehead\">08 / まとめ</div>\n    <h1>まとめ</h1>\n    <div class=\"subtitle\">保守から新たな価値を生み出し、当社のブランド価値を高める</div>\n\n    <section class=\"content\">\n      <div class=\"axis-wrap\">\n        <table>\n          <thead>\n            <tr>\n              <th>提言の軸</th>\n              <th>内容</th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr>\n              <td class=\"axis\">① AI基盤構築の売上化</td>\n              <td>保守費削減効果をもとに、AI基盤構築案件として売上化する</td>\n            </tr>\n            <tr>\n              <td class=\"axis\">② 他ベンダー領域への展開</td>\n              <td>AI基盤構築の実績を基に、他ベンダー領域へ保守費削減提案を広げる</td>\n            </tr>\n            <tr>\n              <td class=\"axis\">③ 保守メンバーの役割の高次元化</td>\n              <td>保守メンバーを、作業担当から改善提案を担う人材へ高次元化する</td>\n            </tr>\n          </tbody>\n        </table>\n      </div>\n\n      <div class=\"tag-row\">\n        <div class=\"message-tag tag-blue\">AI基盤構築の売上化によって</div>\n      </div>\n      <div class=\"bridge\">\n        AIの普及で高まる保守費削減の <strong class=\"threat-word\">脅威</strong> を、<br>\n        <strong class=\"opportunity-word\">売上15％向上</strong> につながる <strong class=\"opportunity-word\">機会</strong> に変える。\n      </div>\n\n      <div class=\"tag-row\">\n        <div class=\"message-tag tag-blue\">他ベンダー領域への展開と保守メンバーの役割の高次元化によって</div>\n      </div>\n      <div class=\"final\">\n        <div class=\"final-main\">AI活用が前提となる時代、保守を攻めの起点にする。</div>\n        <div class=\"final-sub\">\n          保守から新たな価値を生み出し、当社のブランド価値を高める。\n        </div>\n      </div>\n    </section>\n\n        <div class=\"footer-right\">08</div>\n  </main>\n</body>\n</html>","script":"最後にまとめです。\n\n今回の提言の軸は3つです。\n\n1つ目は、保守費削減効果をもとにした、AI基盤構築の売上化です。\n\n2つ目は、自社保守で作った実績をもとにした、他ベンダー領域への展開です。\n\n3つ目は、保守メンバーを作業担当から改善提案を担う人材へ高次元化することです。\n\nAIの普及による保守費削減は、既存保守売上にとって脅威です。\n\nしかし、当社からAI基盤構築を提案できれば、その脅威を売上15％向上につながる機会に変えることができます。\n\nだからこそ、AI活用が前提となる時代、保守を攻めの起点にする。\n\n保守から新たな価値を生み出し、当社のブランド価値を高める。\n\n以上が私の提言です。ご清聴ありがとうございました。","point":"最後に売上15％向上とブランド価値を回収する。","speechText":"最後にまとめです。\n\n今回の提言の軸は3つです。\n\n1つ目は、保守費削減効果をもとにした、AI基盤構築の売上化です。\n\n2つ目は、自社保守で作った実績をもとにした、たベンダー領域への展開です。\n\n3つ目は、保守メンバーを作業担当から改善提案を担う人材へ高次元化することです。\n\nAIの普及による保守費削減は、既存保守売上にとって脅威です。\n\nしかし、当社からAI基盤構築を提案できれば、その脅威を売上15％向上につながる機会に変えることができます。\n\nだからこそ、AI活用が前提となる時代、保守を攻めの起点にする。\n\n保守から新たな価値を生み出し、当社のブランド価値を高める。\n\n以上が私の提言です。ご清聴ありがとうございました。"}];
let index = 0;
let channel = null;
let readMode = false;
let currentUtterance = null;
let speechQueue = [];
let speechPointer = 0;
let speechTimer = null;
let selectedVoice = null;

function getMode() {
  const params = new URLSearchParams(location.search);
  return params.get("mode") || "present";
}
function setupChannel() {
  try {
    channel = new BroadcastChannel("naoe-vm-presentation-sync");
    channel.onmessage = (event) => {
      if (event.data && event.data.type === "slide-change") {
        if (event.data.index !== index) {
          index = event.data.index;
          render(false);
        }
      }
    };
  } catch(e) {}
  window.addEventListener("storage", (e) => {
    if (e.key === "naoe-vm-slide-index") {
      const nextIndex = Number(e.newValue);
      if (!Number.isNaN(nextIndex) && nextIndex !== index) {
        index = nextIndex;
        render(false);
      }
    }
  });
}
function broadcast() {
  try { localStorage.setItem("naoe-vm-slide-index", String(index)); } catch(e) {}
  if (channel) channel.postMessage({ type: "slide-change", index });
}
function setIndex(nextIndex, shouldBroadcast=true) {
  index = Math.max(0, Math.min(slides.length - 1, nextIndex));
  render(shouldBroadcast);
}
function next() { setIndex(index + 1); }
function prev() { setIndex(index - 1); }
function updateReadButton() {
  const btn = document.getElementById("readBtn");
  if (btn) btn.textContent = readMode ? "停止" : "読上";
}

function pickJapaneseVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  if (!voices.length) return null;

  const preferredNames = [
    "Microsoft Nanami", "Microsoft Keita", "Google 日本語", "Google Japanese",
    "Kyoko", "Otoya", "Haruka", "Ichiro"
  ];

  for (const name of preferredNames) {
    const found = voices.find(v => (v.name || "").includes(name));
    if (found) return found;
  }

  return voices.find(v => (v.lang || "").toLowerCase().startsWith("ja")) || null;
}

function makeSpeechChunks(rawText) {
  const text = (rawText || "")
    .replace(/\r/g, "")
    .replace(/\n{3,}/g, "\n\n")
    .replace(/「/g, "「")
    .replace(/」/g, "」");

  const paragraphs = text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  const chunks = [];

  for (const paragraph of paragraphs) {
    const sentences = paragraph
      .replace(/([。！？])/g, "$1|")
      .split("|")
      .map(s => s.trim())
      .filter(Boolean);

    for (const sentence of sentences) {
      if (sentence.length > 120) {
        const parts = sentence
          .replace(/、/g, "、|")
          .split("|")
          .map(s => s.trim())
          .filter(Boolean);
        for (const part of parts) {
          chunks.push({ text: part, pause: 180 });
        }
      } else {
        chunks.push({ text: sentence, pause: 260 });
      }
    }
    if (chunks.length) chunks[chunks.length - 1].pause = 520;
  }

  return chunks;
}

function stopReadAloud() {
  readMode = false;
  speechQueue = [];
  speechPointer = 0;
  if (speechTimer) {
    clearTimeout(speechTimer);
    speechTimer = null;
  }
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  updateReadButton();
}

function speakNextChunk() {
  if (!readMode) return;

  if (speechPointer >= speechQueue.length) {
    if (index < slides.length - 1) {
      speechTimer = setTimeout(() => {
        setIndex(index + 1);
      }, 650);
    } else {
      stopReadAloud();
    }
    return;
  }

  const chunk = speechQueue[speechPointer++];
  currentUtterance = new SpeechSynthesisUtterance(chunk.text);
  currentUtterance.lang = "ja-JP";
  currentUtterance.voice = selectedVoice || pickJapaneseVoice();
  currentUtterance.rate = 0.88;
  currentUtterance.pitch = 1.04;
  currentUtterance.volume = 1.0;

  currentUtterance.onend = () => {
    if (!readMode) return;
    speechTimer = setTimeout(speakNextChunk, chunk.pause);
  };

  currentUtterance.onerror = () => {
    if (!readMode) return;
    speechTimer = setTimeout(speakNextChunk, 250);
  };

  window.speechSynthesis.speak(currentUtterance);
}

function speakCurrentSlide() {
  if (!("speechSynthesis" in window)) {
    alert("このブラウザでは読み上げ機能が利用できません。");
    stopReadAloud();
    return;
  }

  if (speechTimer) {
    clearTimeout(speechTimer);
    speechTimer = null;
  }

  window.speechSynthesis.cancel();
  selectedVoice = pickJapaneseVoice();

  const text = slides[index].speechText || slides[index].script || "";
  speechQueue = makeSpeechChunks(text);
  speechPointer = 0;
  speakNextChunk();
}

function toggleReadAloud() {
  if (!readMode) {
    readMode = true;
    updateReadButton();
    speakCurrentSlide();
  } else {
    stopReadAloud();
  }
}
function keyboard(e) {
  const key = e.key;
  if (["ArrowRight","ArrowDown"," ","PageDown","Enter"].includes(key)) { e.preventDefault(); next(); }
  if (["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(key)) { e.preventDefault(); prev(); }
  if (key.toLowerCase() === "f") {
    e.preventDefault();
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen();
  }
  if (key.toLowerCase() === "r" && getMode() !== "notes") { e.preventDefault(); toggleReadAloud(); }
  if (key === "Home") { e.preventDefault(); setIndex(0); }
  if (key === "End") { e.preventDefault(); setIndex(slides.length - 1); }
}
function renderPresent() {
  document.body.className = "present-body";
  document.body.innerHTML = `
    <main class="stage">
      <div class="frame-wrap" id="frameWrap"><iframe id="slideFrame" title="presentation slide"></iframe></div>
    </main>
    <div class="hud">
      <button class="btn" id="prevBtn">← 前へ</button>
      <span id="counter"></span>
      <button class="btn" id="nextBtn">次へ →</button>
      <button class="btn" id="fullBtn">全画面</button>
      <button class="btn" id="notesBtn">原稿</button>
      <button class="btn" id="readBtn">読上</button>
      <span>Space / ← → / F / R</span>
    </div>
    <div class="progress" id="progress"></div>`;
  document.getElementById("prevBtn").onclick = prev;
  document.getElementById("nextBtn").onclick = next;
  document.getElementById("fullBtn").onclick = () => {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen();
  };
  document.getElementById("notesBtn").onclick = () => {
    const baseUrl = location.href.split("?")[0];
    window.open(baseUrl + "?mode=notes", "naoe-vm-notes");
  };
  document.getElementById("readBtn").onclick = toggleReadAloud;
  updateReadButton();
  document.addEventListener("click", (e) => {
    if (e.target.closest(".hud")) return;
    if (e.clientX > window.innerWidth / 2) next(); else prev();
  });
  updatePresent();
}
function scaleFrame() {
  const wrap = document.getElementById("frameWrap");
  const frame = document.getElementById("slideFrame");
  if (!wrap || !frame) return;
  const s = Math.min(wrap.clientWidth / 1280, wrap.clientHeight / 720);
  frame.style.transform = `scale(${s})`;
}
function updatePresent() {
  const frame = document.getElementById("slideFrame");
  if (!frame) return;
  frame.srcdoc = slides[index].srcdoc;
  document.getElementById("counter").textContent = `${index + 1} / ${slides.length}`;
  document.getElementById("progress").style.width = `${((index + 1) / slides.length) * 100}%`;
  scaleFrame();
}
function renderNotes() {
  document.body.className = "notes-body";
  document.body.innerHTML = `
    <main class="notes-wrap">
      <header class="notes-header">
        <h1 class="notes-title">発表原稿</h1>
        <div class="notes-sub"><span id="notesCounter"></span><span id="notesTitle"></span></div>
      </header>
      <section class="notes-grid">
        <aside class="mini">
          <div class="notes-controls">
            <button class="notes-btn secondary" id="notesPrev">← 前へ</button>
            <button class="notes-btn" id="notesNext">次へ →</button>
          </div>
          <div class="thumbs" id="thumbs"></div>
        </aside>
        <article class="script-card">
          <div class="script-text" id="scriptText"></div>
          <div class="point" id="pointText"></div>
        </article>
      </section>
    </main>`;
  document.getElementById("notesPrev").onclick = prev;
  document.getElementById("notesNext").onclick = next;
  const thumbs = document.getElementById("thumbs");
  slides.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.className = "thumb";
    btn.textContent = i + 1;
    btn.onclick = () => setIndex(i);
    thumbs.appendChild(btn);
  });
  updateNotes();
}
function updateNotes() {
  const s = slides[index];
  document.getElementById("notesCounter").textContent = `${index + 1} / ${slides.length}`;
  document.getElementById("notesTitle").textContent = s.title;
  document.getElementById("scriptText").textContent = s.script;
  document.getElementById("pointText").textContent = "話すポイント：" + s.point;
  document.querySelectorAll(".thumb").forEach((btn, i) => btn.classList.toggle("active", i === index));
}
function render(shouldBroadcast=true) {
  if (getMode() === "notes") updateNotes(); else updatePresent();
  if (readMode && getMode() !== "notes") speakCurrentSlide(); else updateReadButton();
  if (shouldBroadcast) broadcast();
}
setupChannel();
if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => {
    selectedVoice = pickJapaneseVoice();
  };
}
document.addEventListener("keydown", keyboard);
window.addEventListener("resize", scaleFrame);
try {
  const stored = Number(localStorage.getItem("naoe-vm-slide-index"));
  if (!Number.isNaN(stored)) index = Math.max(0, Math.min(slides.length - 1, stored));
} catch(e) {}
if (getMode() === "notes") renderNotes(); else renderPresent();
</script>
</body>
</html>
